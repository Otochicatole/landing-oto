<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galaxy</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #000000;
      }

      .experience {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .experience canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <div class="experience"></div>
    <script src="./experience.js"></script>
    <script src="./scroll-bridge.js"></script>
  </body>
</html>
